<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowX</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0d1117;
        color: #c9d1d9;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        text-align: center;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
      }
      .status {
        margin-top: 8px;
        font-size: 13px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="title">FlowX</div>
        <div id="status" class="status">Starting desktop session...</div>
      </div>
    </div>
  </body>
</html>
